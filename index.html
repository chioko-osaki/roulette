<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>おらだづのおおさき推し選手権 - 大崎市地域おこし協力隊｜第5回 みやぎ地域おこし協力隊フェス</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/roulette.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <!-- イベント名（小さく表示。タイトル画面の代わり） -->
  <div id="event-label">おらだづのおおさき推し選手権</ br>―あなたはいくつ大崎市を知っている？―</div>

  <!-- スタッフ用：管理画面ページへのリンク（目立たない位置に配置） -->
  <a id="admin-open-btn" href="admin.html" aria-label="管理画面を開く">⚙</a>

  <!-- テストモード中だけ表示される警告バナー -->
  <div id="test-mode-banner" hidden>
    <p class="test-banner-title">⚠️ テストモード</p>
    <p class="test-banner-desc">現在はテスト中です。抽選しても景品在庫は減りません。</p>
  </div>

  <!-- ===================== 抽選画面 ===================== -->
  <main id="draw-screen">

    <div id="wheel-wrap">
      <div id="wheel-pointer" aria-hidden="true"></div>
      <div id="wheel-rotor">
        <svg id="wheel-svg" viewBox="0 0 400 400" aria-hidden="true"></svg>
      </div>
    </div>

    <p id="sold-out-message" hidden>すべての景品が終了しました</p>

    <button id="draw-btn" type="button">抽選する</button>
  </main>

  <!-- ===================== 結果画面 ===================== -->
  <section id="result-screen" hidden>
    <p id="result-test-badge" hidden>⚠️ テストモードの結果です（在庫は減っていません）</p>

    <h1 id="result-title">おめでとうございます！</h1>

    <div id="result-image-wrap">
      <img id="result-image" src="" alt="">
      <p id="result-image-fallback" hidden>（画像を読み込めませんでした）</p>
    </div>

    <h2 id="result-name"></h2>

    <p id="result-instruction">スタッフから景品をお受け取りください</p>

    <button id="next-btn" type="button">次の方</button>
  </section>

  <script src="js/storage.js"></script>
  <script src="js/inventory.js"></script>
  <script src="js/history.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/roulette.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
